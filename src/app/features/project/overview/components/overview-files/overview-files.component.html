<div class="wiki flex flex-column p-4 gap-4">
  <h2>{{ 'project.overview.files.title' | translate }}</h2>
  @if (isFilesLoading()) {
    <p-skeleton width="100%" height="5rem" />
  } @else if (fileLoadingError()) {
    <div [innerHtml]="'project.overview.files.fileLoadingError' | translate"></div>
  } @else if (noFiles()) {
    <div [innerHtml]="'project.overview.files.noFilesMessage' | translate"></div>
  } @else {
    <osf-files-tree
      [files]="files()"
      [currentFolder]="currentFolder()"
      [isLoading]="isFilesLoading()"
      [actions]="filesTreeActions"
      [viewOnly]="filesViewOnly()"
      [viewOnlyDownloadable]="false"
      [resourceId]="projectId()"
      [provider]="provider()"
      (folderIsOpening)="folderIsOpening($event)"
      (entryFileClicked)="selectFile($event)"
      (uploadFileConfirmed)="uploadFile($event)"
    >
    </osf-files-tree>
  }
</div>
